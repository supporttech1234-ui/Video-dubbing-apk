plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videodubbing.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.videodubbing.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
